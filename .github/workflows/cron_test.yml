# Api探照灯 · 定时连通性与质量体检
# 每日（UTC）自动执行 ping_test.py（纯探测，不写盘），度量数据唯一写入权归本地测量站。
# 手动触发：GitHub Actions 页 → Run workflow。

name: CI - 定时连通性与质量体检

on:
  schedule:
    # UTC 02:17 / 北京时间 10:17；GitHub 调度可能存在数分钟延迟。
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: api-spotlight-cron-test
  cancel-in-progress: true

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPOTLIGHT_WARN_STALE: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 接口连通性实测（纯校验，不写盘）
        env:
          SPOTLIGHT_TEST_KEY: ${{ secrets.SPOTLIGHT_TEST_KEY }}
        run: |
          set -o pipefail
          python scripts/ping_test.py | tee "$RUNNER_TEMP/ping-test.log"

      - name: 连通性保底核验
        run: |
          if ! grep -Eq '^online|^degraded' "$RUNNER_TEMP/ping-test.log"; then
            echo "本轮没有任何 online/degraded 响应，报警退出"
            exit 1
          fi

      - name: 构建与质量门禁（含真实性门禁，定时CI允许超期警示不阻断）
        run: |
          npm ci
          npm run lint
          npm run build
          npm run contract:check
          python scripts/verify_metrics_truth.py --warn-stale

