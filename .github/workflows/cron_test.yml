# Api探照灯 · 定时实测平台数据（Phase 2）
# 每日（UTC）自动执行 ping_test.py --apply，指标变化时自动提交回仓库。
# 手动触发：GitHub Actions 页 → Run workflow。
#
# 首次配置（一次性）：
# 1. Settings → Actions → General → Workflow permissions → 选 "Read and write permissions"
#    （否则 GITHUB_TOKEN 只读，push 会失败）
# 2. Settings → Secrets and variables → Actions → New secret → SPOTLIGHT_TEST_KEY
#    （测试 Key；留空也行，脚本会跳过鉴权头仅测连通性）

name: CI - 定时实测平台数据

on:
  schedule:
    # UTC 02:17 / 北京时间 10:17；GitHub 调度可能存在数分钟延迟。
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # 允许把实测结果 push 回仓库
  actions: write # watchman：允许触发 deploy_pages.yml（workflow_dispatch 自愈）

concurrency:
  group: api-spotlight-cron-test
  cancel-in-progress: true # 手动触发时取消进行中的定时任务，避免重复写回

jobs:
  test-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 实测并写回 platforms.json
        env:
          # 未配置 secret 时为空字符串，脚本自动走 no-key 模式
          SPOTLIGHT_TEST_KEY: ${{ secrets.SPOTLIGHT_TEST_KEY }}
        run: |
          cp src/data/platforms.json "$RUNNER_TEMP/platforms.before.json"
          set -o pipefail
          python scripts/ping_test.py --apply | tee "$RUNNER_TEMP/ping-test.log"

      # 保护上一份有效数据：若本轮所有站点均不可达，则视为整轮失败并恢复原文件。
      - name: 失败保护 - 保留上一份有效数据
        run: |
          if ! grep -Eq '^online|^degraded' "$RUNNER_TEMP/ping-test.log"; then
            echo "本轮没有任何 online/degraded 响应，恢复上一份有效 platforms.json"
            cp "$RUNNER_TEMP/platforms.before.json" src/data/platforms.json
            exit 1
          fi

      - name: 记录当日历史基线
        run: python scripts/history_update.py --apply

      - name: 构建前质量闸门
        run: |
          npm ci
          npm run lint
          npm run build
          npm run contract:check

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "未检测到指标变化，跳过提交"
          else
            git commit -m "chore: update platform metrics (${GITHUB_SHA::7})"
            git push
          fi

      # Watchman 自愈：按 head_sha 匹配运行记录；同 SHA 已有 完成/进行中/排队 运行时不重复补发
      - name: Watchman - 确保部署跟上 main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD=$(git rev-parse HEAD)
          CHECK() {
            curl -s -m 20 -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy_pages.yml/runs?per_page=10" \
              | python3 -c "import json,sys; runs=json.load(sys.stdin).get('workflow_runs',[]) or []; m=[r for r in runs if r.get('head_sha','')==sys.argv[1]]; print('0' if (m and m[0].get('status') in ('completed','in_progress','queued')) else '1')" "$HEAD"
          }
          NEED=$(CHECK)
          if [ "$NEED" = "1" ]; then
            echo "⏳ 未发现同 SHA 部署运行，等待 45s 复检（排除 push 事件迟到）..."
            sleep 45
            NEED=$(CHECK)
          fi
          if [ "$NEED" = "1" ]; then
            echo "⚠️ 复检后仍无 HEAD=${HEAD} 的部署运行，触发自愈..."
            curl -s -m 20 -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -d '{"ref":"main"}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy_pages.yml/dispatches" \
              -o /dev/null -w "dispatch_http=%{http_code}\n"
          else
            echo "✅ 已存在 HEAD=${HEAD} 的部署运行（完成/进行中/排队），无需自愈"
          fi
