# api-spotlight · Push 自动部署到 Cloudflare Pages
# 需要在仓库 Settings → Secrets and variables → Actions 中配置
# CLOUDFLARE_API_TOKEN（Cloudflare Pages Edit 权限）。

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: api-spotlight-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # 闸门：只允许部署"最新 main"；迟到运行的旧提交直接跳过，防止旧版本覆盖新部署
      - name: 仅部署最新 main 提交
        run: |
          LATEST_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_SHA" != "$LATEST_MAIN" ]; then
            echo "⏭️ 本次运行 head=${GITHUB_SHA:0:8} 已不是最新 main（${LATEST_MAIN:0:8}），跳过部署"
            exit 0
          fi
          echo "✅ 本次为最新 main（${GITHUB_SHA:0:8}），继续部署"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 静态检查 (Lint)
        run: npm run lint

      - name: 构建静态站点
        run: npm run build

      # 契约闸门：校验 src/data 与 public/data 快照符合 Contract v1
      # （schema_version、affiliate_url 恒 null、禁商业字段、结构/取值域、快照一致性）
      - name: 数据契约校验 (Contract v1)
        run: npm run contract:check

      # 双语文案体检（非阻断）：漏译只会回退中文基线，不阻止部署，但日志里要看得见
      - name: i18n 覆盖体检 (非阻断)
        run: npm run i18n:check
        continue-on-error: true

      # 站点闸门：内链可达性 / canonical 无尾斜杠 / hreflang 双向完整 / 英文页无中文残留
      # 新增平台未补英文译文时会在这一步拦下（先跑 npm run i18n:check 定位）
      - name: 站点产物验收
        run: npm run verify:site

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy out --project-name=api-spotlight --branch main
